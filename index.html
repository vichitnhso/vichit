<main
      id="about-page"
      class="page-section"
    ></main>

    <main
      id="contact-page"
      class="page-section"
    ></main>

  </main>


  <!-- =====================================================
       PROJECT DETAIL PAGE (DYNAMIC)
  ====================================================== -->

  <main
    id="project-detail-page"
    class="page-section"
  >
    <div id="project-detail-container"></div>
  </main>


  <!-- =====================================================
       LIGHTBOX MODAL
  ====================================================== -->

  <div
    id="lightbox"
    class="image-lightbox"
    onclick="handleLightboxBackground(event)"
  >
    <button
      class="lightbox-close"
      onclick="closeLightbox()"
    >
      <span class="material-symbols-outlined">close</span>
    </button>

    <button
      class="lightbox-arrow lightbox-prev"
      onclick="previousLightboxImage()"
    >
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <button
      class="lightbox-arrow lightbox-next"
      onclick="nextLightboxImage()"
    >
      <span class="material-symbols-outlined">chevron_right</span>
    </button>

    <img
      id="lightbox-image"
      src=""
      alt="Expanded Image"
    >

    <div
      id="lightbox-counter"
      class="lightbox-counter"
    >
      1 / 1
    </div>
  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* ============================================================
       CONFIGURATION & GLOBAL VARIABLES
    ============================================================ */

    // URL ของ Google Apps Script ที่เชื่อมต่อกับ Google Sheets
    const scriptUrl = 'ใส่_Apps_Script_URL_ของคุณที่นี่';

    const pages = ['home', 'ltc', 'vichit-power', 'about', 'contact'];

    const pageContainerMap = {
      'home': 'home-page',
      'ltc': 'ltc-page',
      'vichit-power': 'vichit-power-page',
      'about': 'about-page',
      'contact': 'contact-page'
    };

    const pageKeyMap = {
      'home': 'home',
      'ltc': 'ltc',
      'vichit-power': 'vichitPower',
      'about': 'about',
      'contact': 'contact'
    };

    let pageData = {};
    let projectsData = [];
    let currentLightboxImages = [];
    let currentLightboxIndex = 0;
    let loadedRequests = 0;


    /* ============================================================
       INITIALIZATION
    ============================================================ */

    window.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');
      loadAllPages();
    });


    /* ============================================================
       JSONP LOADER
    ============================================================ */

    function loadJsonp(action) {
      return new Promise(function(resolve, reject) {
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        let finished = false;

        window[callbackName] = function(data) {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          cleanup();
          resolve(data);
        };

        const script = document.createElement('script');
        script.async = true;

        const timeout = setTimeout(function() {
          if (finished) return;
          finished = true;
          cleanup();
          reject(new Error('Timeout loading: ' + action));
        }, 15000);

        function cleanup() {
          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        script.onerror = function() {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          cleanup();
          reject(new Error('Network error: ' + action));
        };

        script.src = 
          scriptUrl + 
          '?action=' + encodeURIComponent(action) + 
          '&callback=' + encodeURIComponent(callbackName);

        document.head.appendChild(script);
      });
    }


    /* ============================================================
       LOAD ALL PAGES
    ============================================================ */

    function loadAllPages() {
      const loadingScreen = document.getElementById('loading-screen');

      loadJsonp('getAppData')
        .then(function(response) {
          if (!response || !response.success) {
            throw new Error('Invalid response structure');
          }

          pageData = response.pages || {};
          projectsData = response.projects || [];

          renderAllPages();

          if (loadingScreen) {
            loadingScreen.classList.add('hide');
          }
        })
        .catch(function(error) {
          console.error(error);
          
          if (loadingScreen) {
            loadingScreen.classList.add('hide');
          }

          pages.forEach(function(page) {
            const containerId = pageContainerMap[page];
            const container = document.getElementById(containerId);
            if (container) {
              container.innerHTML = `
                <div class="error-box">
                  <div style="font-weight: 600; margin-bottom: 5px;">ไม่สามารถโหลดข้อมูลได้</div>
                  <div>กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตหรือ Apps Script URL</div>
                </div>
              `;
            }
          });
        });
    }


    /* ============================================================
       RENDER PAGES
    ============================================================ */

    function renderAllPages() {
      pages.forEach(function(pageSlug) {
        const pageKey = pageKeyMap[pageSlug];
        const containerId = pageContainerMap[pageSlug];
        const container = document.getElementById(containerId);

        if (!container) return;

        const rawData = pageData[pageKey];

        if (!rawData || (Array.isArray(rawData) && rawData.length === 0)) {
          container.innerHTML = `
            <div class="empty-page">
              <div>
                <div style="font-size: 40px; margin-bottom: 10px;">📂</div>
                <div style="font-size: 18px; font-weight: 500;">ยังไม่มีข้อมูลในหน้านี้</div>
                <div style="font-size: 14px; margin-top: 5px;">โปรดเพิ่มข้อมูลจาก Google Sheets</div>
              </div>
            </div>
          `;
          return;
        }

        let html = '<div class="page-grid">';
        
        if (Array.isArray(rawData)) {
          rawData.forEach(function(item) {
            html += `
              <div class="card ${item.size || 'size-medium'} ${item.clickable ? 'project-clickable' : ''}" 
                   ${item.action ? `onclick="${item.action}"` : ''}>
                <div style="padding: 25px;">
                  ${item.title ? `<div style="font-size: 20px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">${item.title}</div>` : ''}
                  ${item.subtitle ? `<div style="font-size: 15px; color: #2563eb; margin-bottom: 10px;">${item.subtitle}</div>` : ''}
                  ${item.description ? `<div style="font-size: 15px; color: #475569; line-height: 1.6;">${item.description}</div>` : ''}
                </div>
              </div>
            `;
          });
        }

        html += '</div>';
        container.innerHTML = html;
      });
    }


    /* ============================================================
       NAVIGATION & UI CONTROLS
    ============================================================ */

    function switchPage(pageSlug) {
      Object.keys(pageContainerMap).forEach(function(slug) {
        const el = document.getElementById(pageContainerMap[slug]);
        if (el) el.classList.remove('active');
      });

      const detailPage = document.getElementById('project-detail-page');
      if (detailPage) detailPage.classList.remove('active');

      const targetEl = document.getElementById(pageContainerMap[pageSlug]);
      if (targetEl) targetEl.classList.add('active');

      document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(function(el) {
        el.classList.remove('active');
        if (el.getAttribute('data-page') === pageSlug) {
          el.classList.add('active');
        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      if (menu) menu.classList.toggle('show');
    }

    function closeMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      if (menu) menu.classList.remove('show');
    }

    function handleLightboxBackground(event) {
      if (event.target.id === 'lightbox') {
        closeLightbox();
      }
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      if (lightbox) lightbox.classList.remove('show');
    }

    function previousLightboxImage() {
      if (currentLightboxImages.length === 0) return;
      currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
      updateLightboxImage();
    }

    function nextLightboxImage() {
      if (currentLightboxImages.length === 0) return;
      currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
      updateLightboxImage();
    }

    function updateLightboxImage() {
      const imgEl = document.getElementById('lightbox-image');
      const counterEl = document.getElementById('lightbox-counter');
      if (imgEl && currentLightboxImages[currentLightboxIndex]) {
        imgEl.src = currentLightboxImages[currentLightboxIndex];
      }
      if (counterEl) {
        counterEl.innerText = (currentLightboxIndex + 1) + ' / ' + currentLightboxImages.length;
      }
    }

  </script>

</body>
</html>
