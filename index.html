<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wichit Municipality Portal</title>
  
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <style>
    /* ตั้งค่าสไตล์พื้นฐาน */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .page-section {
      display: none;
      padding: 30px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .page-section.active {
      display: block;
    }
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }
    .project-clickable {
      cursor: pointer;
    }
    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-box, .empty-page {
      text-align: center;
      padding: 50px 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
      color: #64748b;
    }
    .error-box {
      color: #ef4444;
      background: #fef2f2;
    }
    /* Lightbox Styles */
    .image-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .image-lightbox.show {
      display: flex;
    }
    .image-lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
    }
    .lightbox-close, .lightbox-arrow {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover, .lightbox-arrow:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    .lightbox-close { top: 20px; right: 20px; }
    .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 15px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: #475569;">กำลังโหลดข้อมูลจากระบบ...</div>
  </div>

  <!-- =====================================================
       PAGE CONTAINERS
  ====================================================== -->

  <main id="home-page" class="page-section active"></main>
  <main id="ltc-page" class="page-section"></main>
  <main id="vichit-power-page" class="page-section"></main>
  <main id="about-page" class="page-section"></main>
  <main id="contact-page" class="page-section"></main>

  <!-- Project Detail Dynamic Page -->
  <main id="project-detail-page" class="page-section">
    <div id="project-detail-container"></div>
  </main>

  <!-- =====================================================
       LIGHTBOX MODAL
  ====================================================== -->
  <div id="lightbox" class="image-lightbox" onclick="handleLightboxBackground(event)">
    <button class="lightbox-close" onclick="closeLightbox()"><span class="material-symbols-outlined">close</span></button>
    <button class="lightbox-arrow lightbox-prev" onclick="previousLightboxImage()"><span class="material-symbols-outlined">chevron_left</span></button>
    <button class="lightbox-arrow lightbox-next" onclick="nextLightboxImage()"><span class="material-symbols-outlined">chevron_right</span></button>
    <img id="lightbox-image" src="" alt="Expanded Image">
    <div id="lightbox-counter" class="lightbox-counter">1 / 1</div>
  </div>

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->
  <script>
    /* ============================================================
       CONFIGURATION & GLOBAL VARIABLES
    ============================================================ */
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbySpcPpLJIvieC0JRd1rTuw_J_z8sOK0dAF1yTTAg6z9w2aBTtfYdt_MDctENlB2dDAzA/exec';

    const pages = ['home', 'ltc', 'vichit-power', 'about', 'contact'];

    const pageContainerMap = {
      'home': 'home-page',
      'ltc': 'ltc-page',
      'vichit-power': 'vichit-power-page',
      'about': 'about-page',
      'contact': 'contact-page'
    };

    const pageKeyMap = {
      'home': 'home',
      'ltc': 'ltc',
      'vichit-power': 'vichitPower',
      'about': 'about',
      'contact': 'contact'
    };

    let pageData = {};
    let projectsData = [];
    let currentLightboxImages = [];
    let currentLightboxIndex = 0;

    /* ============================================================
       INITIALIZATION
    ============================================================ */
    window.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');
      loadAllPages();
    });

    /* ============================================================
       JSONP LOADER
    ============================================================ */
    function loadJsonp(action) {
      return new Promise(function(resolve, reject) {
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        let finished = false;

        window[callbackName] = function(data) {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          cleanup();
          resolve(data);
        };

        const script = document.createElement('script');
        script.async = true;

        const timeout = setTimeout(function() {
          if (finished) return;
          finished = true;
          cleanup();
          reject(new Error('Timeout loading: ' + action));
        }, 15000);

        function cleanup() {
          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        script.onerror = function() {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          cleanup();
          reject(new Error('Network error: ' + action));
        };

        script.src = scriptUrl + '?action=' + encodeURIComponent(action) + '&callback=' + encodeURIComponent(callbackName);
        document.head.appendChild(script);
      });
    }

    /* ============================================================
       LOAD ALL PAGES
    ============================================================ */
    function loadAllPages() {
      const loadingScreen = document.getElementById('loading-screen');

      loadJsonp('getAppData')
        .then(function(response) {
          if (!response || !response.success) {
            throw new Error('Invalid response structure');
          }

          pageData = response.pages || {};
          projectsData = response.projects || [];

          renderAllPages();

          if (loadingScreen) {
            loadingScreen.classList.add('hide');
          }
        })
        .catch(function(error) {
          console.error(error);
          
          if (loadingScreen) {
            loadingScreen.classList.add('hide');
          }

          pages.forEach(function(page) {
            const containerId = pageContainerMap[page];
            const container = document.getElementById(containerId);
            if (container) {
              container.innerHTML = `
                <div class="error-box">
                  <div style="font-weight: 600; margin-bottom: 5px;">ไม่สามารถโหลดข้อมูลได้</div>
                  <div>กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตหรือ Apps Script URL</div>
                </div>
              `;
            }
          });
        });
    }

    /* ============================================================
       RENDER PAGES
    ============================================================ */
    function renderAllPages() {
      pages.forEach(function(pageSlug) {
        const pageKey = pageKeyMap[pageSlug];
        const containerId = pageContainerMap[pageSlug];
        const container = document.getElementById(containerId);

        if (!container) return;

        const rawData = pageData[pageKey];

        if (!rawData || (Array.isArray(rawData) && rawData.length === 0)) {
          container.innerHTML = `
            <div class="empty-page">
              <div>
                <div style="font-size: 40px; margin-bottom: 10px;">📂</div>
                <div style="font-size: 18px; font-weight: 500;">ยังไม่มีข้อมูลในหน้านี้</div>
                <div style="font-size: 14px; margin-top: 5px;">โปรดเพิ่มข้อมูลจาก Google Sheets</div>
              </div>
            </div>
          `;
          return;
        }

        let html = '<div class="page-grid">';
        
        if (Array.isArray(rawData)) {
          rawData.forEach(function(item) {
            html += `
              <div class="card ${item.size || 'size-medium'} ${item.clickable ? 'project-clickable' : ''}" 
                   ${item.action ? `onclick="${item.action}"` : ''}>
                <div style="padding: 25px;">
                  ${item.title ? `<div style="font-size: 20px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">${item.title}</div>` : ''}
                  ${item.subtitle ? `<div style="font-size: 15px; color: #2563eb; margin-bottom: 10px;">${item.subtitle}</div>` : ''}
                  ${item.description ? `<div style="font-size: 15px; color: #475569; line-height: 1.6;">${item.description}</div>` : ''}
                </div>
              </div>
            `;
          });
        }

        html += '</div>';
        container.innerHTML = html;
      });
    }

    /* ============================================================
       NAVIGATION & UI CONTROLS
    ============================================================ */
    function switchPage(pageSlug) {
      Object.keys(pageContainerMap).forEach(function(slug) {
        const el = document.getElementById(pageContainerMap[slug]);
        if (el) el.classList.remove('active');
      });

      const detailPage = document.getElementById('project-detail-page');
      if (detailPage) detailPage.classList.remove('active');

      const targetEl = document.getElementById(pageContainerMap[pageSlug]);
      if (targetEl) targetEl.classList.add('active');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleLightboxBackground(event) {
      if (event.target.id === 'lightbox') {
        closeLightbox();
      }
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      if (lightbox) lightbox.classList.remove('show');
    }

    function previousLightboxImage() {
      if (currentLightboxImages.length === 0) return;
      currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
      updateLightboxImage();
    }

    function nextLightboxImage() {
      if (currentLightboxImages.length === 0) return;
      currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
      updateLightboxImage();
    }

    function updateLightboxImage() {
      const imgEl = document.getElementById('lightbox-image');
      const counterEl = document.getElementById('lightbox-counter');
      if (imgEl && currentLightboxImages[currentLightboxIndex]) {
        imgEl.src = currentLightboxImages[currentLightboxIndex];
      }
      if (counterEl) {
        counterEl.innerText = (currentLightboxIndex + 1) + ' / ' + currentLightboxImages.length;
      }
    }
  </script>

</body>
</html>
