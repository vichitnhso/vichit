<!DOCTYPE html>
<html lang="th">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
<link
  rel="icon"
  type="image/svg+xml"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230f172a'/%3E%3Cpath d='M8 32h48M32 3c8 8 12 18 12 29s-4 21-12 29M32 3C24 11 20 21 20 32s4 21 12 29M8 19c8 5 16 7 24 7s16-2 24-7M8 45c8-5 16-7 24-7s16 2 24 7' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M10 10l44 44' stroke='%23ef4444' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
>
  <title>
    กองทุนหลักประกันสุขภาพเทศบาลตำบลวิชิต
  </title>


  <!-- =====================================================
       GOOGLE FONT
  ====================================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       MATERIAL SYMBOLS
  ====================================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       GLOBAL
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      margin: 0;
      padding: 0;
      background: #f3f6f9;
      color: #222;
      font-family:
        "Kanit",
        Arial,
        "Tahoma",
        sans-serif;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    body.loaded {
      opacity: 1;
    }


    /* =====================================================
       LOADING SCREEN
    ===================================================== */

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #f3f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation:
        loadingSpin 0.8s linear infinite;
    }

    @keyframes loadingSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 15px;
      color: #64748b;
    }


    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background:
        rgba(15, 23, 42, 0.96);
      backdrop-filter:
        blur(14px);
      -webkit-backdrop-filter:
        blur(14px);
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 9999;
      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.15);
    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo {
      color: white;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }


    /* =====================================================
       DESKTOP MENU
    ===================================================== */

    .nav-menu {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item {
      color:
        rgba(255,255,255,0.75);
      font-size: 14px;
      padding: 9px 15px;
      border-radius: 10px;
      cursor: pointer;
      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    .nav-item:hover {
      background:
        rgba(255,255,255,0.08);
      color: white;
    }

    .nav-item.active {
      background:
        rgba(255,255,255,0.12);
      color: white;
    }


    /* =====================================================
       HAMBURGER
    ===================================================== */

    .hamburger {
      display: none;
      margin-left: auto;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      background:
        rgba(255,255,255,0.08);
    }

    .hamburger span {
      font-size: 27px;
    }


    /* =====================================================
       MOBILE MENU
    ===================================================== */

    .mobile-menu {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      background:
        rgba(15,23,42,0.98);
      backdrop-filter:
        blur(15px);
      -webkit-backdrop-filter:
        blur(15px);
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 5px;
      z-index: 9998;
    }

    .mobile-menu.show {
      display: flex;
    }

    .mobile-nav-item {
      color:
        rgba(255,255,255,0.8);
      padding: 15px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .mobile-nav-item:hover,
    .mobile-nav-item.active {
      background:
        rgba(255,255,255,0.1);
      color: white;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    main {
      width: 100%;
      padding-top: 60px;
      min-height: 100vh;
    }

    .page-section {
      display: none;
      width: 100%;
    }

    .page-section.active {
      display: block;
    }


    /* =====================================================
       GRID
    ===================================================== */

    .page-grid {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 25px;
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      grid-auto-rows:
        minmax(100px, auto);
      gap: 18px;
    }


    /* =====================================================
       SIZE
    ===================================================== */

    .size-full {
      grid-column: 1 / -1;
    }

    .size-2x2 {
      grid-column: span 2;
      grid-row: span 2;
    }

    .size-2x1 {
      grid-column: span 2;
    }

    .size-1x2 {
      grid-row: span 2;
    }

    .size-1x1 {
      grid-column: span 1;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .card {
      position: relative;
      width: 100%;
      min-height: 150px;
      overflow: hidden;
      border-radius: 20px;
      background: white;
      box-shadow:
        0 8px 30px
        rgba(15,23,42,0.08);
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
      animation:
        cardAppear 0.6s ease both;
    }

    .card:hover {
      transform:
        translateY(-4px);
      box-shadow:
        0 15px 40px
        rgba(15,23,42,0.13);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform:
          translateY(20px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }


    /* =====================================================
       UNIVERSAL MULTI IMAGE
    ===================================================== */

    .multi-image-card {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition:
        background-image 0.8s ease-in-out,
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }


    /* =====================================================
       UNIVERSAL IMAGE SLIDER DOTS
    ===================================================== */

    .image-slider-dots {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform:
        translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 20px;
      background:
        rgba(0,0,0,0.18);
      backdrop-filter:
        blur(4px);
      -webkit-backdrop-filter:
        blur(4px);
    }

    .image-slider-dot {
      width: 18px;
      height: 3px;
      border-radius: 10px;
      background:
        rgba(255,255,255,0.45);
      cursor: pointer;
      transition:
        width 0.3s ease,
        background 0.3s ease,
        transform 0.3s ease;
    }

    .image-slider-dot:hover {
      background: white;
      transform:
        scaleY(1.3);
    }

    .image-slider-dot.active {
      width: 30px;
      background: white;
    }


    /* =====================================================
       HERO BANNER
    ===================================================== */

    .hero-banner {
      position: relative;
      width: 100%;
      min-height: 500px;
      border-radius: 24px;
      overflow: hidden;
      background-color: #dceeff;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      align-items: flex-end;
      transition:
        background-image 0.8s ease-in-out;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.65),
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.05)
        );
      z-index: 1;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 45px;
      color: white;
    }

    .hero-title {
      margin: 0 0 8px 0;
      font-size:
        clamp(
          28px,
          4vw,
          54px
        );
      font-weight: 600;
      line-height: 1.15;
      text-shadow:
        0 3px 12px
        rgba(0,0,0,0.35);
    }

    .hero-subtitle {
      margin: 0;
      font-size:
        clamp(
          15px,
          2vw,
          23px
        );
      font-weight: 300;
      opacity: 0.95;
      text-shadow:
        0 2px 8px
        rgba(0,0,0,0.35);
    }


    /* =====================================================
       SECTION TITLE
    ===================================================== */

    .section-title {
      padding: 25px 10px;
      background: transparent;
      min-height: auto;
      box-shadow: none;
      border-radius: 0;
    }

    .section-title h2 {
      margin: 0 0 5px 0;
      font-size: 28px;
      font-weight: 600;
      color: #0f172a;
    }

    .section-title p {
      margin: 0;
      color: #64748b;
      font-size: 15px;
    }


    /* =====================================================
       TEXT BLOCK
    ===================================================== */

    .text-block {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .text-block h2 {
      margin: 0 0 10px 0;
      color: #0f172a;
      font-size: 24px;
    }

    .text-block p {
      margin: 0;
      color: #64748b;
      line-height: 1.8;
      font-size: 15px;
      white-space: pre-line;
    }


    /* =====================================================
       SERVICE
    ===================================================== */

    .service-card {
      position: relative;
      min-height: 260px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      color: white;
      cursor: pointer;
      background: #0f172a;
      background-size: cover;
      background-position: center;
      border-radius: 20px;
    }

    .service-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.8),
          rgba(0,0,0,0.15)
        );
      z-index: 1;
      pointer-events: none;
    }

    .service-content {
      position: relative;
      z-index: 2;
    }

    .service-title {
      margin: 0 0 5px 0;
      font-size: 22px;
      font-weight: 500;
    }

    .service-subtitle {
      margin: 0;
      font-size: 14px;
      color:
        rgba(255,255,255,0.8);
    }


    /* =====================================================
       PROJECT CARD HINT
    ===================================================== */

    .project-card-arrow {
      position: absolute;
      right: 20px;
      top: 20px;
      z-index: 5;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        rgba(255,255,255,0.16);
      backdrop-filter:
        blur(8px);
      color: white;
      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .service-card:hover
    .project-card-arrow {
      transform:
        translateX(4px);
      background:
        rgba(255,255,255,0.25);
    }


    /* =====================================================
       STAT
    ===================================================== */

    .stat-card {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .stat-number {
      font-size: 48px;
      line-height: 1;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .stat-title {
      font-size: 16px;
      color: #64748b;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      min-height: 300px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a
        );
      color: white;
    }

    .hero h2 {
      margin: 0 0 10px 0;
      font-size: 34px;
    }

    .hero p {
      margin: 0;
      opacity: 0.85;
      line-height: 1.7;
      white-space: pre-line;
    }


    /* =====================================================
       CONTACT
    ===================================================== */

    .contact-card {
      padding: 30px;
    }

    .contact-card h2 {
      margin: 0 0 15px 0;
      color: #0f172a;
    }

    .contact-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      color: #475569;
      line-height: 1.6;
    }

    .contact-line
    .material-symbols-outlined {
      font-size: 21px;
      color: #2563eb;
    }


    /* =====================================================
       IMAGE
    ===================================================== */

    .card-image {
      width: 100%;
      height: 100%;
      min-height: 220px;
      object-fit: cover;
      display: block;
    }


    /* =====================================================
       REVEAL
    ===================================================== */

    .reveal {
      opacity: 0;
      transform:
        translateY(25px);
      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    .reveal.show {
      opacity: 1;
      transform:
        translateY(0);
    }


    /* =====================================================
       CLICKABLE
    ===================================================== */

    .project-clickable {
      cursor: pointer;
    }

    .project-clickable:active {
      transform:
        scale(0.99);
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .empty-page {
      width: 100%;
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      text-align: center;
      padding: 30px;
    }


    /* =====================================================
       ERROR
    ===================================================== */

    .error-box {
      margin: 30px;
      padding: 20px;
      background: #fff1f2;
      color: #be123c;
      border:
        1px solid #fecdd3;
      border-radius: 12px;
      text-align: center;
    }


    /* =====================================================
       PROJECT DETAIL
    ===================================================== */

    .project-detail {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 30px 20px 80px;
    }

    .project-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      color: #1d4ed8;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 0;
      margin: 0 0 20px 0;
    }

    .project-back:hover {
      opacity: 0.7;
    }

    .project-detail-cover {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 24px;
      display: block;
      margin: 0 0 30px 0;
      background: #e2e8f0;
    }


    /* =====================================================
       PROJECT TITLE
    ===================================================== */

    .project-detail-title {
      display: block;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.1;
      font-weight: 700;
      color: #111827;
      margin: 0;
      padding: 0;
    }


    /* =====================================================
       PROJECT DESCRIPTION
       รูปแบบเอกสาร / รายงาน
    ===================================================== */

    .project-detail-description {
      display: block;
      width: 100%;

      font-size: 18px;
      line-height: 1.9;
      font-weight: 400;

      color: #374151;

      margin: 22px 0 0 0;
      padding: 0;

      /*
        จัดข้อความชิดซ้ายและขวา
        ใช้ inter-character สำหรับภาษาไทย
      */
      text-align: justify;
      text-justify: inter-character;

      overflow-wrap: break-word;
      word-break: normal;
    }


    /* =====================================================
       PROJECT PARAGRAPH
    ===================================================== */

    .project-detail-description p {
      margin: 0 0 22px 0;
      padding: 0;

      /*
        เยื้องบรรทัดแรกเหมือนเอกสาร
      */
      text-indent: 2em;

      /*
        ชิดซ้าย + ชิดขวา
      */
      text-align: justify;
      text-justify: inter-character;

      /*
        ป้องกันข้อความล้นจอ
      */
      overflow-wrap: break-word;
      word-break: normal;

      /*
        ช่วยให้ browser จัดข้อความภาษาไทยได้ดีขึ้น
      */
      hyphens: none;
    }

    .project-detail-description p:last-child {
      margin-bottom: 0;
    }


    /* =====================================================
       PROJECT GALLERY
    ===================================================== */

    .project-gallery-title {
      font-size: 28px;
      font-weight: 700;
      margin: 40px 0 20px 0;
      padding: 0;
      color: #111827;
    }

    .project-gallery {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 16px;
    }

    .project-gallery-item {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      cursor: pointer;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
      background: #e2e8f0;
    }

    .project-gallery-item:hover {
      transform: scale(1.02);
      box-shadow:
        0 10px 30px
        rgba(15,23,42,0.15);
    }


    /* =====================================================
       PROJECT VIDEO
    ===================================================== */

    .project-video {
      margin-top: 50px;
    }

    .project-video-title {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 20px;
      color: #111827;
    }

    .project-video-list {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .project-video-box {
      width: 100%;
    }

    .project-video iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 20px;
      display: block;
      background: #000;
    }


    /* =====================================================
       PROJECT EMPTY
    ===================================================== */

    .project-empty {
      text-align: center;
      padding: 80px 20px;
      color: #6b7280;
    }


    /* =====================================================
       IMAGE LIGHTBOX
    ===================================================== */

    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background:
        rgba(0, 0, 0, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: 0.25s ease;
    }

    .image-lightbox.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .image-lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background:
        rgba(255,255,255,0.15);
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .lightbox-close:hover {
      background:
        rgba(255,255,255,0.25);
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform:
        translateY(-50%);
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background:
        rgba(255,255,255,0.14);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .lightbox-arrow:hover {
      background:
        rgba(255,255,255,0.25);
    }

    .lightbox-prev {
      left: 20px;
    }

    .lightbox-next {
      right: 20px;
    }

    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform:
        translateX(-50%);
      color: white;
      background:
        rgba(0,0,0,0.45);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 1024px) {

      .page-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
        padding: 18px;
        gap: 15px;
      }

      .size-full {
        grid-column: 1 / -1;
      }

      .size-2x2 {
        grid-column: span 2;
        grid-row: span 2;
      }

      .size-2x1 {
        grid-column: span 2;
      }

      .size-1x2 {
        grid-row: span 2;
      }

      .hero-banner {
        min-height: 430px;
      }

  <!-- =====================================================

  <script>

    /* =====================================================
       GLOBAL
    ===================================================== */

    let pageData = {};

    let projectsData = [];

    let loadedRequests = 0;

    let lastNormalPage = 'home';

    let currentLightboxImages = [];

    let currentLightboxIndex = 0;


    /* =====================================================
       NORMAL PAGES
    ===================================================== */

    const pages = [
      'home',
      'vichit-power',
      'about',
      'contact'
    ];


    /* =====================================================
       PAGE → HTML ID
    ===================================================== */

    const pageContainerMap = {

      'home':
        'home-page',

      'vichit-power':
        'vichit-power-page',

      'about':
        'about-page',

      'contact':
        'contact-page',

      'project-detail':
        'project-detail-page'

    };


    /* =====================================================
       START
    ===================================================== */

    window.onload = function() {

      loadAllPages();

    };


    /* =====================================================
       LOAD DATA
    ===================================================== */

/* =====================================================
   API URL
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbze8__1iXQPhVRqItCfadoyQunvzOwZ4vjs_GBAETy8/dev';


/* =====================================================
   LOAD ALL PAGES
===================================================== */

async function loadAllPages() {

  try {

    console.log(
      'กำลังโหลดข้อมูลจาก API...'
    );


    /*
     * โหลดข้อมูลหน้าเว็บ
     */

    const pagesResponse =
      await fetch(
        API_URL +
        '?action=pages'
      );


    if (!pagesResponse.ok) {

      throw new Error(
        'โหลดข้อมูล Pages ไม่สำเร็จ'
      );

    }


    const allPages =
      await pagesResponse.json();


    console.log(
      'โหลด Pages สำเร็จ:',
      allPages
    );


    /*
     * เก็บข้อมูลแต่ละหน้า
     */

    pages.forEach(function(pageName) {

      pageData[pageName] =
        allPages[pageName] || [];

    });


    /*
     * โหลด Projects
     */

    const projectsResponse =
      await fetch(
        API_URL +
        '?action=projects'
      );


    if (!projectsResponse.ok) {

      throw new Error(
        'โหลด Projects ไม่สำเร็จ'
      );

    }


    projectsData =
      await projectsResponse.json();


    console.log(
      'โหลด Projects สำเร็จ:',
      projectsData
    );


    /*
     * เริ่มต้นเว็บไซต์
     */

    initApp();


  }
  catch (error) {

    console.error(
      'โหลดข้อมูลจาก API ไม่สำเร็จ:',
      error
    );


    /*
     * ป้องกันเว็บค้างหน้า Loading
     */

    pages.forEach(function(pageName) {

      pageData[pageName] = [];

    });


    projectsData = [];


    initApp();

  }

}

    /* =====================================================
       INIT
    ===================================================== */

    function initApp() {

      pages.forEach(function(pageName) {

        renderPage(pageName);

      });


      switchPage('home');


      document.body.classList.add(
        'loaded'
      );


      setTimeout(function() {

        const loading =
          document.getElementById(
            'loading-screen'
          );

        if (loading) {

          loading.classList.add(
            'hide'
          );

        }

      }, 300);


      console.log(
        'จำนวนโครงการ:',
        projectsData.length
      );

    }


    /* =====================================================
       GET PAGE CONTAINER
    ===================================================== */

    function getPageContainer(
      pageName
    ) {

      const id =
        pageContainerMap[pageName];

      if (!id) {

        return null;

      }

      return document.getElementById(id);

    }


    /* =====================================================
       RENDER PAGE
    ===================================================== */

    function renderPage(
      pageName
    ) {

      const container =
        getPageContainer(pageName);

      if (!container) {

        return;

      }

      const data =
        pageData[pageName] || [];

      container.innerHTML = '';


      if (!data.length) {

        container.innerHTML = `

          <div class="empty-page">

            <div>

              <span
                class="material-symbols-outlined"
                style="
                  font-size:48px;
                  opacity:.4;
                "
              >
                folder_open
              </span>

              <div
                style="
                  margin-top:10px;
                "
              >
                ยังไม่มีข้อมูลในหน้านี้
              </div>

            </div>

          </div>

        `;

        return;

      }


      const grid =
        document.createElement('div');

      grid.className =
        'page-grid';


      data.forEach(function(
        item,
        index
      ) {

        const card =
          createCard(
            item,
            index,
            pageName
          );

        if (card) {

          grid.appendChild(card);

        }

      });


      container.appendChild(grid);

      observeReveal();

    }


    /* =====================================================
       CREATE CARD
    ===================================================== */

    function createCard(
      item,
      index,
      pageName
    ) {

      const type =
        String(
          item.type || 'service'
        )
        .trim()
        .toLowerCase();


      const size =
        String(
          item.size || '1x1'
        )
        .trim()
        .toLowerCase();

        item.title || '';


      const subtitle =
        item.subtitle || '';


      const iconUrl =
        item.iconUrl || '';


      /* ===================================================
         HERO BANNER
      =================================================== */

      if (
        type === 'hero-banner'
      ) {

        return createHeroBanner(
          item,
          size
        );

      }


      /* ===================================================
         SECTION TITLE
      =================================================== */

      if (
        type === 'section-title'
      ) {

        const card =
          document.createElement('div');

        card.className =
          `card section-title size-${size} reveal`;

        card.innerHTML = `

          <h2>
            ${escapeHtml(title)}
          </h2>

          ${
            subtitle
              ? `
                <p>
                  ${escapeHtml(subtitle)}
                </p>
              `
              : ''
          }

        `;

        setupCardImages(
          card,
          iconUrl
        );

        return makeCardClickable(
          card,
          item
        );

      }


      /* ===================================================
         TEXT BLOCK
      =================================================== */

      if (
        type === 'text-block'
      ) {

        const card =
          document.createElement('div');

        card.className =
          `card text-block size-${size} reveal`;

        card.innerHTML = `

          <h2>
            ${escapeHtml(title)}
          </h2>

          ${
            subtitle
              ? `
                <p>
                  ${escapeHtml(subtitle)}
                </p>
              `
              : ''
          }

        `;

        setupCardImages(
          card,
          iconUrl
        );

        return makeCardClickable(
          card,
          item
        );

      }


      /* ===================================================
         HERO
      =================================================== */

      if (
        type === 'hero'
      ) {

        const card =
          document.createElement('div');

        card.className =
          `card hero size-${size} reveal`;

        card.innerHTML = `

          <h2>
            ${escapeHtml(title)}
          </h2>

          ${
            subtitle
              ? `
                <p>
                  ${escapeHtml(subtitle)}
                </p>
              `
              : ''
          }

        `;

        setupCardImages(
          card,
          iconUrl
        );

        return makeCardClickable(
          card,
          item
        );

      }


      /* ===================================================
         STAT
      =================================================== */

      if (
        type === 'stat'
      ) {

        const card =
          document.createElement('div');

        card.className =
          `card stat-card size-${size} reveal`;

        card.innerHTML = `

          <div class="stat-number">

            ${escapeHtml(title)}

          </div>

          ${
            subtitle
              ? `
                <div class="stat-title">
                  ${escapeHtml(subtitle)}
                </div>
              `
              : ''
          }

        `;

        setupCardImages(
          card,
          iconUrl
        );

        return makeCardClickable(
          card,
          item
        );

      }


      /* ===================================================
         CONTACT
      =================================================== */

      if (
        type === 'contact'
      ) {

        const card =
          document.createElement('div');

        card.className =
          `card contact-card size-${size} reveal`;

        card.innerHTML = `

          <h2>
            ${escapeHtml(title)}
          </h2>

          ${
            subtitle
              ? `
                <div class="contact-line">

                  <span
                    class="material-symbols-outlined"
                  >
                    location_on
                  </span>

                  <span>
                    ${escapeHtml(subtitle)}
                  </span>

                </div>
              `
              : ''
          }

        `;

        setupCardImages(
          card,
          iconUrl
        );

        return makeCardClickable(
          card,
          item
        );

      }


      /* ===================================================
         SERVICE / PROJECT / REVIEW / DEFAULT
      =================================================== */

      const card =
        document.createElement('div');

      card.className =
        `card service-card size-${size} reveal`;

      card.innerHTML = `

        <div class="service-content">

          <div class="service-title">

            ${escapeHtml(title)}

          </div>

          ${
            subtitle
              ? `
                <div class="service-subtitle">

                  ${escapeHtml(subtitle)}

                </div>
              `
              : ''
          }

        </div>

      `;


      const project =
        findProjectForCard(item);


      if (project) {

        const arrow =
          document.createElement('div');

        arrow.className =
          'project-card-arrow';

        arrow.innerHTML = `

          <span
            class="material-symbols-outlined"
          >
            arrow_forward
          </span>

        `;

        card.appendChild(
          arrow
        );

      }


      setupCardImages(
        card,
        iconUrl
      );


      return makeCardClickable(
        card,
        item
      );

    }


    /* =====================================================
       UNIVERSAL IMAGE SYSTEM
    ===================================================== */

    function setupCardImages(
      card,
      iconUrl
    ) {

      if (
        !card ||
        !iconUrl
      ) {

        return;

      }


      const images =
        extractImageUrls(
          iconUrl
        );


      if (
        images.length === 0
      ) {

        return;

      }


      card.classList.add(
        'multi-image-card'
      );


      card.style.backgroundImage =
        `url("${images[0]}")`;


      if (
        images.length === 1
      ) {

        return;

      }


      let currentImage = 0;


      const dots =
        document.createElement(
          'div'
        );


      dots.className =
        'image-slider-dots';


      images.forEach(function(
        image,
        index
      ) {

        const dot =
          document.createElement(
            'div'
          );


        dot.className =
          'image-slider-dot';


        if (
          index === 0
        ) {

          dot.classList.add(
            'active'
          );

        }


        dot.addEventListener(
          'click',
          function(event) {

            event.preventDefault();

            event.stopPropagation();


            currentImage =
              index;


            changeCardImage();

          }
        );


        dots.appendChild(
          dot
        );

      });


      card.appendChild(
        dots
      );


      function changeCardImage() {

        card.style.backgroundImage =
          `url("${images[currentImage]}")`;


        const allDots =
          dots.querySelectorAll(
            '.image-slider-dot'
          );


        allDots.forEach(function(
          dot,
          dotIndex
        ) {

          dot.classList.toggle(
            'active',
            dotIndex === currentImage
          );

        });

      }


      setInterval(
        function() {

          currentImage++;


          if (
            currentImage >=
            images.length
          ) {

            currentImage = 0;

          }


          changeCardImage();

        },
        5000
      );

    }


    /* =====================================================
       EXTRACT IMAGE URLS
    ===================================================== */

    function extractImageUrls(
      rawValue
    ) {

      const raw =
        String(
          rawValue || ''
        )
        .replace(
          /\r?\n/g,
          '|'
        )
        .trim();


      if (!raw) {

        return [];

      }


      const images = [];


      const markdownRegex =
        /\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/gi;


      let match;


      while (
        (match =
          markdownRegex.exec(raw))
        !== null
      ) {

        const url =
          String(
            match[1] || ''
          ).trim();


        if (
          isSafeHttpUrl(url)
        ) {

          images.push(
            url
          );

        }

      }


      if (
        images.length > 0
      ) {

        return images;

      }


      return raw
        .split('|')
        .map(function(part) {

          let url =
            String(
              part || ''
            ).trim();


          const markdown =
            url.match(
              /^\[[^\]]*\]\((https?:\/\/[^)\s]+)\)$/i
            );


          if (
            markdown
          ) {

            url =
              markdown[1];

          }


          return url;

        })
        .filter(function(url) {

          return isSafeHttpUrl(
            url
          );

        });

    }


    /* =====================================================
       FIND PROJECT FOR CARD
    ===================================================== */

    function findProjectForCard(
      item
    ) {

      if (
        !projectsData ||
        !projectsData.length ||
        !item
      ) {

        return null;

      }


      const link =
        String(
          item.linkUrl || ''
        ).trim();


      const title =
        normalizeText(
          item.title || ''
        );


      if (
        /^project\s*:/i.test(link)
      ) {

        const id =
          link
            .replace(
              /^project\s*:/i,
              ''
            )
            .trim();


        const found =
          projectsData.find(
            function(project) {

              return (
                normalizeProjectId(
                  project.id
                ) ===
                normalizeProjectId(
                  id
                )
              );

            }
          );


        if (found) {

          return found;

        }

      }


      if (
        link &&
        !isSafeHttpUrl(link)
      ) {

        const byId =
          projectsData.find(
            function(project) {

              return (
                normalizeProjectId(
                  project.id
                ) ===
                normalizeProjectId(
                  link
                )
              );

            }
          );


        if (byId) {

          return byId;

        }

      }


      if (
        !link &&
        title
      ) {

        const byTitle =
          projectsData.find(
            function(project) {

              return (
                normalizeText(
                  project.title
                ) ===
                title
              );

            }
          );


        if (byTitle) {

          return byTitle;

        }

      }


      return null;

    }


    /* =====================================================
       NORMALIZE TEXT
    ===================================================== */

    function normalizeText(
      value
    ) {

      return String(
        value || ''
      )
      .trim()
      .replace(
        /\s+/g,
        ' '
      )
      .toLowerCase();

    }


    /* =====================================================
       NORMALIZE PROJECT ID
    ===================================================== */

    function normalizeProjectId(
      value
    ) {

      const text =
        String(
          value || ''
        ).trim();


      if (!text) {

        return '';

      }


      if (
        /^\d+$/.test(text)
      ) {

        return String(
          parseInt(
            text,
            10
          )
        );

      }


      return text.toLowerCase();

    }


    /* =====================================================
       HERO BANNER
    ===================================================== */

    function createHeroBanner(
      item,
      size
    ) {

      const card =
        document.createElement('div');


      card.className =
        `card hero-banner size-${size} reveal`;


      const overlay =
        document.createElement('div');


      overlay.className =
        'hero-overlay';


      const content =
        document.createElement('div');


      content.className =
        'hero-content';


      content.innerHTML = `

        <div class="hero-title">

          ${escapeHtml(
            item.title || ''
          )}

        </div>

        ${
          item.subtitle
            ? `
              <div
                class="hero-subtitle"
              >

                ${escapeHtml(
                  item.subtitle
                )}

              </div>
            `
            : ''
        }

      `;


      card.appendChild(
        overlay
      );


      card.appendChild(
        content
      );


      setupCardImages(
        card,
        item.iconUrl || ''
      );


      return makeCardClickable(
        card,
        item
      );

    }


    /* =====================================================
       MAKE CARD CLICKABLE
    ===================================================== */

    function makeCardClickable(
      element,
      item
    ) {

      if (
        !element ||
        !item
      ) {

        return element;

      }


      const project =
        findProjectForCard(
          item
        );


      if (project) {

        element.style.cursor =
          'pointer';


        element.classList.add(
          'project-clickable'
        );


        element.addEventListener(
          'click',
          function(event) {

            event.stopPropagation();


            openProjectDetail(
              project.id
            );

          }
        );


        return element;

      }


      const url =
        String(
          item.linkUrl || ''
        ).trim();


      if (
        url &&
        isSafeHttpUrl(url)
      ) {

        element.style.cursor =
          'pointer';


        element.addEventListener(
          'click',
          function(event) {

            event.stopPropagation();


            window.open(
              url,
              '_blank',
              'noopener,noreferrer'
            );

          }
        );

      }


      return element;

    }


    /* =====================================================
       OPEN PROJECT DETAIL
    ===================================================== */

    function openProjectDetail(
      projectId
    ) {

      const project =
        projectsData.find(
          function(item) {

            return (
              normalizeProjectId(
                item.id
              ) ===
              normalizeProjectId(
                projectId
              )
            );

          }
        );


      if (!project) {

        console.error(
          'ไม่พบโครงการ:',
          projectId
        );


        renderProjectError(
          'ไม่พบข้อมูลโครงการ'
        );


        switchPage(
          'project-detail'
        );


        return;

      }


      lastNormalPage =
        getCurrentNormalPage();


      renderProjectDetail(
        project
      );


      switchPage(
        'project-detail'
      );


      closeMobileMenu();

    }


    /* =====================================================
       GET CURRENT NORMAL PAGE
    ===================================================== */

    function getCurrentNormalPage() {

      for (
        let i = 0;
        i < pages.length;
        i++
      ) {

        const page =
          pages[i];


        const container =
          getPageContainer(page);


        if (
          container &&
          container.classList.contains(
            'active'
          )
        ) {

          return page;

        }

      }


      return 'home';

    }


    /* =====================================================
       RENDER PROJECT DETAIL
       ⭐ COMPLETE
       ⭐ ทุกโครงการใช้ระบบเดียวกัน
    ===================================================== */

    function renderProjectDetail(
      project
    ) {

      const container =
        getPageContainer(
          'project-detail'
        );


      if (!container) {

        return;

      }


      const gallery =
        Array.isArray(
          project.gallery
        )
          ? project.gallery.filter(
              function(url) {

                return isSafeHttpUrl(
                  url
                );

              }
            )
          : [];


      const cover =
        isSafeHttpUrl(
          project.coverUrl
        )
          ? project.coverUrl
          : '';


      const videoUrls =
        getProjectVideoUrls(
          project
        );


      /* ===================================================
         TITLE
      =================================================== */

      const titleText =
        String(
          project.title || 'โครงการ'
        )
        .trim();


      /* ===================================================
         DESCRIPTION
         ดึงข้อมูลจาก Google Sheet
      =================================================== */

      const descriptionText =
        String(
          project.description || ''
        )
        .replace(
          /^\s+/,
          ''
        )
        .trim();


      let html = `

        <div class="project-detail">

          <button
            class="project-back"
            type="button"
            onclick="backFromProjectDetail()"
          >

            <span class="material-symbols-outlined">
              arrow_back
            </span>

            กลับ

          </button>

      `;


      /* ===================================================
         COVER
      =================================================== */

      if (cover) {

        html += `

          <img
            class="project-detail-cover"
            src="${escapeAttribute(cover)}"
            alt="${escapeAttribute(titleText)}"
          >

        `;

      }


      /* ===================================================
         TITLE
      =================================================== */

      html +=
        '<h1 class="project-detail-title">' +
        escapeHtml(titleText) +
        '</h1>';


      /* ===================================================
         DESCRIPTION
         ⭐ เว้นบรรทัดใน Sheet = ย่อหน้าใหม่
         ⭐ ขึ้นบรรทัดใหม่ธรรมดา = ต่อเนื่องย่อหน้าเดิม
         ⭐ ใช้กับทุกโครงการ
      =================================================== */

      if (descriptionText) {

        const paragraphs =
          descriptionText
            .split(/\n\s*\n/)
            .map(function(paragraph) {

              return paragraph
                .replace(/\r?\n/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            })
            .filter(function(paragraph) {

              return paragraph !== '';

            });


        html +=
          '<div class="project-detail-description">';


        paragraphs.forEach(
          function(paragraph) {

            html +=
              '<p>' +
              escapeHtml(paragraph) +
              '</p>';

          }
        );


        html +=
          '</div>';

      }


      /* ===================================================
         GALLERY
      =================================================== */

      if (
        gallery.length
      ) {

        html += `

          <section>

            <h2 class="project-gallery-title">

              ภาพกิจกรรม

            </h2>

            <div
              class="project-gallery"
            >

        `;


        gallery.forEach(
          function(
            image,
            index
          ) {

            html += `

              <img
                class="project-gallery-item"
                src="${escapeAttribute(image)}"
                alt="ภาพกิจกรรม ${index + 1}"
                loading="lazy"
                onclick="openLightbox(${index})"
              >

            `;

          }
        );


        html += `

            </div>

          </section>

        `;

      }


      /* ===================================================
         VIDEO
      =================================================== */

      if (
        videoUrls.length
      ) {

        html += `

          <section class="project-video">

            <h2 class="project-video-title">

              วิดีโอ

            </h2>

            <div class="project-video-list">

        `;


        videoUrls.forEach(
          function(
            videoUrl,
            index
          ) {

            const embedUrl =
              getYouTubeEmbedUrl(
                videoUrl
              );


            if (embedUrl) {

              html += `

                <div class="project-video-box">

                  <iframe
                    src="${escapeAttribute(embedUrl)}"
                    title="วิดีโอโครงการ ${index + 1}"
                    loading="lazy"
                    allow="
                      accelerometer;
                      autoplay;
                      clipboard-write;
                      encrypted-media;
                      gyroscope;
                      picture-in-picture;
                      web-share
                    "
                    allowfullscreen
                  ></iframe>

                </div>

              `;

            }

          }
        );


        html += `

            </div>

          </section>

        `;

      }


      /* ===================================================
         EMPTY
      =================================================== */

      if (
        !cover &&
        !gallery.length &&
        !descriptionText &&
        !videoUrls.length
      ) {

        html += `

          <div class="project-empty">

            ยังไม่มีรายละเอียดเพิ่มเติม

          </div>

        `;

      }


      html += `

        </div>

      `;


      container.innerHTML =
        html;


      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

    }


    /* =====================================================
       PROJECT ERROR
    ===================================================== */

    function renderProjectError(
      message
    ) {

      const container =
        getPageContainer(
          'project-detail'
        );


      if (!container) {

        return;

      }


      container.innerHTML = `

        <div class="project-detail">

          <button
            class="project-back"
            type="button"
            onclick="backFromProjectDetail()"
          >

            <span class="material-symbols-outlined">
              arrow_back
            </span>

            กลับ

          </button>

          <div class="project-empty">

            <span
              class="material-symbols-outlined"
              style="
                font-size:55px;
                opacity:.35;
              "
            >
              error_outline
            </span>

            <div style="margin-top:10px">

              ${escapeHtml(message)}

            </div>

          </div>

        </div>

      `;

    }


    /* =====================================================
       BACK FROM PROJECT
    ===================================================== */

    function backFromProjectDetail() {

      closeLightbox();


      switchPage(
        lastNormalPage || 'home'
      );

    }


    /* =====================================================
       GET VIDEO URLS
    ===================================================== */

    function getProjectVideoUrls(
      project
    ) {

      let urls = [];


      if (
        Array.isArray(
          project.videoUrls
        )
      ) {

        urls =
          project.videoUrls;

      }
      else if (
        project.videoUrl
      ) {

        urls = [
          project.videoUrl
        ];

      }


      return urls
        .map(function(url) {

          return String(
            url || ''
          ).trim();

        })
        .filter(function(url) {

          return url !== '';

        });

    }


    /* =====================================================
       YOUTUBE EMBED
    ===================================================== */

    function getYouTubeEmbedUrl(
      url
    ) {

      if (!url) {

        return '';

      }


      let videoId = '';


      try {

        const parsed =
          new URL(url);


        const hostname =
          parsed.hostname
            .replace(
              'www.',
              ''
            )
            .toLowerCase();


        if (
          hostname === 'youtube.com' ||
          hostname === 'm.youtube.com'
        ) {

          if (
            parsed.pathname === '/watch'
          ) {

            videoId =
              parsed.searchParams.get(
                'v'
              ) || '';

          }
          else if (
            parsed.pathname.indexOf(
              '/shorts/'
            ) === 0
          ) {

            videoId =
              parsed.pathname
                .split('/shorts/')[1]
                .split('/')[0];

          }
          else if (
            parsed.pathname.indexOf(
              '/embed/'
            ) === 0
          ) {

            videoId =
              parsed.pathname
                .split('/embed/')[1]
                .split('/')[0];

          }

        }


        if (
          hostname === 'youtu.be'
        ) {

          videoId =
            parsed.pathname
              .replace(
                '/',
                ''
              )
              .split('/')[0];

        }

      }
      catch (error) {

        return '';

      }


      if (!videoId) {

        return '';

      }


      videoId =
        videoId.replace(
          /[^a-zA-Z0-9_-]/g,
          ''
        );


      return (
        'https://www.youtube.com/embed/' +
        videoId
      );

    }


    /* =====================================================
       LIGHTBOX
    ===================================================== */

    function openLightbox(
      index
    ) {

      const projectPage =
        getPageContainer(
          'project-detail'
        );


      if (!projectPage) {

        return;

      }


      const images =
        Array.from(
          projectPage.querySelectorAll(
            '.project-gallery-item'
          )
        )
        .map(function(img) {

          return img.src;

        })
        .filter(function(url) {

          return url !== '';

        });


      if (!images.length) {

        return;

      }


      currentLightboxImages =
        images;


      currentLightboxIndex =
        Math.max(
          0,
          Math.min(
            index,
            images.length - 1
          )
        );


      updateLightbox();


      const lightbox =
        document.getElementById(
          'image-lightbox'
        );


      if (!lightbox) {

        return;

      }


      lightbox.classList.add(
        'show'
      );


      document.body.style.overflow =
        'hidden';

    }


    /* =====================================================
       UPDATE LIGHTBOX
    ===================================================== */

    function updateLightbox() {

      const image =
        document.getElementById(
          'lightbox-image'
        );


      const counter =
        document.getElementById(
          'lightbox-counter'
        );


      if (
        !image ||
        !currentLightboxImages.length
      ) {

        return;

      }


      image.src =
        currentLightboxImages[
          currentLightboxIndex
        ];


      if (counter) {

        counter.textContent =
          (
            currentLightboxIndex + 1
          ) +
          ' / ' +
          currentLightboxImages.length;

      }

    }


    /* =====================================================
       NEXT IMAGE
    ===================================================== */

    function nextLightboxImage(
      event
    ) {

      if (event) {

        event.stopPropagation();

      }


      if (
        currentLightboxImages.length <= 1
      ) {

        return;

      }


      currentLightboxIndex++;


      if (
        currentLightboxIndex >=
        currentLightboxImages.length
      ) {

        currentLightboxIndex = 0;

      }


      updateLightbox();

    }


    /* =====================================================
       PREVIOUS IMAGE
    ===================================================== */

    function previousLightboxImage(
      event
    ) {

      if (event) {

        event.stopPropagation();

      }


      if (
        currentLightboxImages.length <= 1
      ) {

        return;

      }


      currentLightboxIndex--;


      if (
        currentLightboxIndex < 0
      ) {

        currentLightboxIndex =
          currentLightboxImages.length - 1;

      }


      updateLightbox();

    }


    /* =====================================================
       CLOSE LIGHTBOX
    ===================================================== */

    function closeLightbox() {

      const lightbox =
        document.getElementById(
          'image-lightbox'
        );


      if (lightbox) {

        lightbox.classList.remove(
          'show'
        );

      }


      document.body.style.overflow =
        '';


      currentLightboxImages = [];

      currentLightboxIndex = 0;

    }


    /* =====================================================
       LIGHTBOX BACKGROUND
    ===================================================== */

    function handleLightboxBackground(
      event
    ) {

      const lightbox =
        document.getElementById(
          'image-lightbox'
        );


      if (
        event.target === lightbox
      ) {

        closeLightbox();

      }

    }


    /* =====================================================
       KEYBOARD
    ===================================================== */

    document.addEventListener(
      'keydown',
      function(event) {

        const lightbox =
          document.getElementById(
            'image-lightbox'
          );


        if (
          !lightbox ||
          !lightbox.classList.contains(
            'show'
          )
        ) {

          return;

        }


        if (
          event.key === 'Escape'
        ) {

          closeLightbox();

        }


        if (
          event.key === 'ArrowRight'
        ) {

          nextLightboxImage();

        }


        if (
          event.key === 'ArrowLeft'
        ) {

          previousLightboxImage();

        }

      }
    );


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }


      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* =====================================================
       ESCAPE ATTRIBUTE
    ===================================================== */

    function escapeAttribute(
      value
    ) {

      return escapeHtml(value);

    }


    /* =====================================================
       SAFE HTTP URL
    ===================================================== */

    function isSafeHttpUrl(
      value
    ) {

      if (!value) {

        return false;

      }


      try {

        const url =
          new URL(
            String(value).trim()
          );


        return (
          url.protocol === 'http:' ||
          url.protocol === 'https:'
        );

      }
      catch (error) {

        return false;

      }

    }


    /* =====================================================
       SWITCH PAGE
    ===================================================== */

    function switchPage(
      pageName
    ) {

      if (
        !pageContainerMap[pageName]
      ) {

        pageName = 'home';

      }


      if (
        pages.indexOf(pageName) !== -1
      ) {

        lastNormalPage =
          pageName;

      }


      Object.keys(
        pageContainerMap
      )
      .forEach(function(page) {

        const container =
          getPageContainer(page);


        if (container) {

          container.classList.remove(
            'active'
          );

        }

      });


      const activeContainer =
        getPageContainer(
          pageName
        );


      if (activeContainer) {

        activeContainer.classList.add(
          'active'
        );

      }


      document
        .querySelectorAll(
          '.nav-item'
        )
        .forEach(function(item) {

          item.classList.toggle(
            'active',
            item.dataset.page ===
              pageName
          );

        });


      document
        .querySelectorAll(
          '.mobile-nav-item'
        )
        .forEach(function(item) {

          item.classList.toggle(
            'active',
            item.dataset.page ===
              pageName
          );

        });


      window.scrollTo({

        top: 0,

        behavior: 'smooth'

      });

    }


    /* =====================================================
       MOBILE MENU
    ===================================================== */

    function toggleMobileMenu() {

      const menu =
        document.getElementById(
          'mobile-menu'
        );


      if (!menu) {

        return;

      }


      menu.classList.toggle(
        'show'
      );

    }


    function closeMobileMenu() {

      const menu =
        document.getElementById(
          'mobile-menu'
        );


      if (!menu) {

        return;

      }


      menu.classList.remove(
        'show'
      );

    }


    /* =====================================================
       REVEAL
    ===================================================== */

    function observeReveal() {

      const elements =
        document.querySelectorAll(
          '.reveal:not(.reveal-observed)'
        );


      if (
        !(
          'IntersectionObserver'
          in window
        )
      ) {

        elements.forEach(
          function(element) {

            element.classList.add(
              'show'
            );

          }
        );

        return;

      }


      const observer =
        new IntersectionObserver(

          function(entries) {

            entries.forEach(
              function(entry) {

                if (
                  entry.isIntersecting
                ) {

                  entry.target.classList.add(
                    'show'
                  );


                  observer.unobserve(
                    entry.target
                  );

                }

              }
            );

          },

          {
            threshold: 0.08
          }

        );


      elements.forEach(
        function(element) {

          element.classList.add(
            'reveal-observed'
          );


          observer.observe(
            element
          );

        }
      );

    }


    /* =====================================================
       CLOSE MOBILE MENU WHEN CLICK OUTSIDE
    ===================================================== */

    document.addEventListener(
      'click',
      function(event) {

        const menu =
          document.getElementById(
            'mobile-menu'
          );


        const hamburger =
          document.querySelector(
            '.hamburger'
          );


        if (
          menu &&
          menu.classList.contains(
            'show'
          ) &&
          !menu.contains(
            event.target
          ) &&
          hamburger &&
          !hamburger.contains(
            event.target
          )
        ) {

          closeMobileMenu();

        }

      }
    );

  </script>
